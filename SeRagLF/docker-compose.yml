# First boot (MySQL + Qdrant + Redis + gateway): docker compose up -d
#
# When mysql / qdrant / redis are already running and you only changed the MCP
# gateway (rebuild or config), do NOT bounce the whole stack. Use either:
#   docker compose restart gateway
# or rebuild and replace only the gateway container:
#   docker compose up -d --build --no-deps gateway
#
# --no-deps avoids starting or recreating mysql, qdrant, and redis.

services:
  # Infrastructure

  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localtest}
      MYSQL_DATABASE: seraglf
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.14.0
    ports:
      - "${QDRANT_REST_PUBLISH_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PUBLISH_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    command: >-
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Application

  gateway:
    image: ${GATEWAY_IMAGE:-seraglf/gateway:latest}
    build:
      context: ./gateway
    ports:
      - "${GATEWAY_PUBLISH_PORT:-8080}:8080"
    environment:
      SERAGLF_SERVER_MCP_TRANSPORT: http
      SERAGLF_SERVER_HTTP_PORT: 8080
      SERAGLF_LLM_PROVIDER: openai
      SERAGLF_LLM_API_KEY: ${OPENAI_API_KEY:-}
      SERAGLF_LLM_GRADER_MODEL: gpt-4o-mini
      SERAGLF_LLM_GENERATOR_MODEL: gpt-4o
      SERAGLF_EMBEDDING_PROVIDER: openai
      SERAGLF_EMBEDDING_API_KEY: ${OPENAI_API_KEY:-}
      SERAGLF_EMBEDDING_MODEL: text-embedding-3-small
      SERAGLF_QDRANT_ADDRESS: qdrant:6334
      SERAGLF_MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-localtest}@tcp(mysql:3306)/seraglf?charset=utf8mb4&parseTime=True&loc=Local"
      SERAGLF_REDIS_ADDRESS: redis:6379
      SERAGLF_MEMORY_SHORT_TERM_TTL_HOURS: "24"
      SERAGLF_MEMORY_MAX_CONVERSATION_MESSAGES: "200"
      SERAGLF_MEMORY_SUMMARY_COLLECTION: _memory
      SERAGLF_MEMORY_FACTS_COLLECTION: _user_facts
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
